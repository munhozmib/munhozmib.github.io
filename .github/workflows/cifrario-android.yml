name: Cifrário (Android)

on:
  push:
    paths: ["cifrario-android/**", ".github/workflows/cifrario-android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cifrario-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: SDK do Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" > /dev/null
      - name: Testes
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: cifrario-debug-apk
          path: cifrario-android/app/build/outputs/apk/debug/*.apk
